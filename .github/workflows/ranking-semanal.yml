name: Ranking semanal

on:
  schedule:
    # Lunes a las 06:15 UTC. GitHub pide no usar el minuto 0.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consultar la API de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/actualizar-ranking.mjs

      - name: Guardar el JSON si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ranking.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el ranking."
          else
            git commit -m "Actualiza el ranking semanal de repositorios"
            git push
          fi
